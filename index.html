<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日语假名小游戏</title>
    <style>
        /* 全局样式 */
        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 40px 30px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #444;
            margin-bottom: 10px;
        }

        .score {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 20px;
        }

        .kana-display {
            font-size: 100px;
            margin: 20px 0;
            color: #333;
            line-height: 1.2;
            min-height: 120px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }

        .option-btn {
            background-color: #f0f0f0;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .option-btn:hover {
            background-color: #e0e0e0;
            transform: translateY(-2px);
        }

        .option-btn:active {
            transform: translateY(0);
        }

        .option-btn.correct {
            background-color: #4CAF50;
            color: white;
        }

        .option-btn.wrong {
            background-color: #f44336;
            color: white;
        }

        .feedback {
            font-size: 1.1rem;
            margin: 10px 0;
            min-height: 1.5em;
            font-weight: bold;
        }

        .speaker-btn {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            margin-left: 10px;
            vertical-align: middle;
        }

        .next-btn {
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .next-btn:hover {
            background-color: #0b7dda;
        }

        .next-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎌 假名读音挑战</h1>
        <div class="score">得分：<span id="score">0</span></div>
        
        <!-- 显示假名 -->
        <div class="kana-display">
            <span id="kana">あ</span>
            <button class="speaker-btn" id="speaker" title="播放发音">🔊</button>
        </div>

        <!-- 选项按钮 -->
        <div class="button-grid" id="options">
            <!-- 动态生成 -->
        </div>

        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="nextBtn" disabled>下一题 ➡️</button>
    </div>

    <script>
        // 平假名与罗马音对照表（可扩展）
        const kanaList = [
            { char: 'あ', romaji: 'a' },
            { char: 'い', romaji: 'i' },
            { char: 'う', romaji: 'u' },
            { char: 'え', romaji: 'e' },
            { char: 'お', romaji: 'o' },
            { char: 'か', romaji: 'ka' },
            { char: 'き', romaji: 'ki' },
            { char: 'く', romaji: 'ku' },
            { char: 'け', romaji: 'ke' },
            { char: 'こ', romaji: 'ko' },
            { char: 'さ', romaji: 'sa' },
            { char: 'し', romaji: 'shi' },
            { char: 'す', romaji: 'su' },
            { char: 'せ', romaji: 'se' },
            { char: 'そ', romaji: 'so' },
            { char: 'た', romaji: 'ta' },
            { char: 'ち', romaji: 'chi' },
            { char: 'つ', romaji: 'tsu' },
            { char: 'て', romaji: 'te' },
            { char: 'と', romaji: 'to' },
            { char: 'な', romaji: 'na' },
            { char: 'に', romaji: 'ni' },
            { char: 'ぬ', romaji: 'nu' },
            { char: 'ね', romaji: 'ne' },
            { char: 'の', romaji: 'no' },
            { char: 'は', romaji: 'ha' },
            { char: 'ひ', romaji: 'hi' },
            { char: 'ふ', romaji: 'fu' },
            { char: 'へ', romaji: 'he' },
            { char: 'ほ', romaji: 'ho' },
            { char: 'ま', romaji: 'ma' },
            { char: 'み', romaji: 'mi' },
            { char: 'む', romaji: 'mu' },
            { char: 'め', romaji: 'me' },
            { char: 'も', romaji: 'mo' },
            { char: 'や', romaji: 'ya' },
            { char: 'ゆ', romaji: 'yu' },
            { char: 'よ', romaji: 'yo' },
            { char: 'ら', romaji: 'ra' },
            { char: 'り', romaji: 'ri' },
            { char: 'る', romaji: 'ru' },
            { char: 'れ', romaji: 're' },
            { char: 'ろ', romaji: 'ro' },
            { char: 'わ', romaji: 'wa' },
            { char: 'を', romaji: 'wo' },
            { char: 'ん', romaji: 'n' }
        ];

        // 游戏状态
        let currentKana = null;
        let score = 0;
        let answered = false; // 是否已经回答当前题目

        // DOM 元素
        const kanaEl = document.getElementById('kana');
        const optionsEl = document.getElementById('options');
        const feedbackEl = document.getElementById('feedback');
        const scoreEl = document.getElementById('score');
        const nextBtn = document.getElementById('nextBtn');
        const speakerBtn = document.getElementById('speaker');

        // 初始化游戏
        function initGame() {
            score = 0;
            updateScore();
            nextQuestion();
        }

        // 随机获取一个不重复的假名（避免连续相同）
        function getRandomKana() {
            const filtered = kanaList.filter(k => k !== currentKana);
            const randomIndex = Math.floor(Math.random() * filtered.length);
            return filtered[randomIndex];
        }

        // 生成四个选项（一个正确，三个错误且不重复）
        function generateOptions(correctRomaji) {
            const options = [correctRomaji];
            const allRomaji = kanaList.map(k => k.romaji);
            
            // 洗牌所有罗马音
            const shuffled = [...allRomaji].sort(() => Math.random() - 0.5);
            
            for (let romaji of shuffled) {
                if (options.length >= 4) break;
                if (!options.includes(romaji)) {
                    options.push(romaji);
                }
            }
            
            // 再次洗牌选项顺序
            return options.sort(() => Math.random() - 0.5);
        }

        // 显示新题目
        function nextQuestion() {
            answered = false;
            feedbackEl.textContent = '';
            nextBtn.disabled = true;
            
            // 清除按钮颜色
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.remove('correct', 'wrong');
                btn.disabled = false;
            });

            currentKana = getRandomKana();
            kanaEl.textContent = currentKana.char;

            const options = generateOptions(currentKana.romaji);
            optionsEl.innerHTML = '';
            
            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.addEventListener('click', () => handleAnswer(btn, option));
                optionsEl.appendChild(btn);
            });
        }

        // 处理用户选择
        function handleAnswer(btn, selected) {
            if (answered) return; // 已经回答过，防止重复点击
            answered = true;
            nextBtn.disabled = false;

            // 禁用所有按钮
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

            const isCorrect = selected === currentKana.romaji;
            
            if (isCorrect) {
                btn.classList.add('correct');
                feedbackEl.textContent = '✅ 正确！';
                feedbackEl.style.color = 'green';
                score++;
                updateScore();
            } else {
                btn.classList.add('wrong');
                // 高亮正确答案
                document.querySelectorAll('.option-btn').forEach(b => {
                    if (b.textContent === currentKana.romaji) {
                        b.classList.add('correct');
                    }
                });
                feedbackEl.textContent = '❌ 错误，正确答案是：' + currentKana.romaji;
                feedbackEl.style.color = 'red';
            }
        }

        // 更新分数显示
        function updateScore() {
            scoreEl.textContent = score;
        }

        // 播放发音（使用 Web Speech API）
        function speak() {
            if (!('speechSynthesis' in window)) {
                alert('你的浏览器不支持语音合成，请使用最新版 Chrome 或 Edge。');
                return;
            }
            
            const utterance = new SpeechSynthesisUtterance(currentKana.char);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.8; // 语速稍慢
            window.speechSynthesis.cancel(); // 取消之前的语音
            window.speechSynthesis.speak(utterance);
        }

        // 事件监听
        nextBtn.addEventListener('click', nextQuestion);
        speakerBtn.addEventListener('click', speak);

        // 开始游戏
        initGame();
    </script>
</body>
</html>
