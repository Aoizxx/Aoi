<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日语假名小游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-container">
        <header class="game-header">
            <h1>假名读音挑战</h1>
            <p class="score">得分 <span id="score">0</span></p>
        </header>

        <section class="kana-display" aria-label="当前假名">
            <span id="kana">あ</span>
            <button class="speaker-btn" id="speaker" title="播放发音" aria-label="播放发音">🔊</button>
        </section>

        <section class="button-grid" id="options" aria-label="选项">
            <!-- 动态生成 -->
        </section>

        <p class="feedback" id="feedback" aria-live="polite"></p>

        <button class="next-btn" id="nextBtn" disabled>下一题</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
